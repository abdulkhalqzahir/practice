<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ABDULKHALQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;600;700;900&family=Noto+Sans+Arabic:wght@400;500;600;700&family=Cinzel:wght@500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d0a08;
    --bg-panel:#171210;
    --bg-panel-2:#211a16;
    --line:#3a2c22;
    --ash:#7d746a;
    --bone:#e7ddc9;
    --blood:#9c1c1c;
    --blood-bright:#d43a2f;
    --ember:#ff7a29;
    --glass:#8fd7d1;
    --glass-dim:#2c5754;
    --text:#EFE7D8;
    --text-dim:#8f8478;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 1000px 600px at 50% -8%, #3a1410 0%, transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:'Noto Sans Arabic','Tahoma',sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  ::selection{ background:var(--blood-bright); color:#1a0403; }

  header{
    background:linear-gradient(180deg,#1c1310,#100c0a);
    border-bottom:1px solid var(--line);
    padding:14px 22px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
    box-shadow:0 1px 0 rgba(212,58,47,.15);
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand-mark{
    width:36px;height:36px;border-radius:4px;
    background:linear-gradient(155deg,#3a3430,#171210);
    border:1px solid var(--blood-bright);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 14px rgba(212,58,47,.3);
    font-family:'Cinzel',serif;
    font-weight:900; color:var(--ember); font-size:16px;
  }
  .brand-name{ font-family:'Cinzel',serif; font-weight:700; font-size:15px; letter-spacing:1px; color:var(--bone); }
  .brand-sub{ font-size:10px; color:var(--text-dim); font-family:'JetBrains Mono',monospace; letter-spacing:1.5px; }

  .stats{ display:flex; align-items:center; gap:18px; font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--text-dim); direction:ltr; }
  .stat{ display:flex; align-items:center; gap:6px; }
  .stat b{ color:var(--bone); font-weight:600; }
  .stat.wpm b{ color:var(--glass); }
  .stat.acc b{ color:var(--ember); }

  main{ flex:1; display:flex; justify-content:center; padding:36px 18px 60px; }
  .wrap{ width:100%; max-width:800px; }

  /* --- mode select screen --- */
  #modeSelect{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:340px; text-align:center; gap:22px;
  }
  #modeSelect h1{
    font-family:'Noto Kufi Arabic',sans-serif; font-weight:900; font-size:24px;
    color:var(--bone); margin:0;
  }
  #modeSelect p{ color:var(--text-dim); font-size:13px; margin:0; font-family:'JetBrains Mono',monospace; direction:ltr; }
  .mode-row{ display:flex; gap:14px; flex-wrap:wrap; justify-content:center; }
  .mode-btn{
    font-family:'Cinzel',serif; font-weight:700; font-size:22px;
    color:var(--bone); background:var(--bg-panel); border:1px solid var(--line);
    border-radius:8px; padding:18px 28px; cursor:pointer; min-width:110px;
    transition:border-color .15s, transform .1s, background .15s;
  }
  .mode-btn:hover{ border-color:var(--ember); background:var(--bg-panel-2); }
  .mode-btn:active{ transform:scale(.96); }
  .mode-btn small{ display:block; font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--text-dim); font-weight:400; margin-top:6px; letter-spacing:1px; }

  #practiceArea{ display:none; }

  .progress-track{
    height:7px; border-radius:2px; background:var(--bg-panel-2);
    border:1px solid var(--line); overflow:hidden; margin-bottom:26px;
  }
  .progress-fill{
    height:100%; width:0%;
    background:linear-gradient(90deg,var(--blood),var(--ember));
    transition:width .3s ease;
  }

  .stage{
    position:relative;
    background:var(--bg-panel);
    border:1px solid var(--line);
    border-radius:6px;
    overflow:hidden;
    margin-bottom:18px;
  }
  .stage-inner{
    direction:ltr;
    position:relative;
    height:220px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .stage-flash{
    position:absolute; inset:0; background:#ffe6cc; opacity:0; pointer-events:none;
  }
  .stage-flash.on{ opacity:.35; transition:none; }

  #glassBox{ position:relative; width:150px; height:180px; z-index:2; }
  #glassBox.hidden svg#glassSvg{ opacity:0; }
  #glassSvg{ transition:opacity .12s; }
  .crack{ opacity:0; transition:opacity .18s ease; }
  .crack.show{ opacity:1; }

  #swordBox{
    position:absolute; left:calc(50% + 96px); top:34%;
    width:130px; height:150px;
    transform-origin:16% 88%;
    transform:rotate(-14deg);
    z-index:3;
    will-change:transform;
  }
  #swordBox.strike{ animation:swing .2s ease-out; }
  @keyframes swing{
    0%{ transform:rotate(-14deg); }
    38%{ transform:rotate(-64deg); }
    100%{ transform:rotate(-14deg); }
  }

  .spark{
    position:absolute; width:5px; height:5px; border-radius:50%;
    background:var(--ember); pointer-events:none; z-index:4;
    animation:sparkFly .3s ease-out forwards;
  }
  @keyframes sparkFly{
    to{ transform:translate(var(--dx),var(--dy)) scale(0); opacity:0; }
  }

  .shard{
    position:absolute; width:13px; height:13px; pointer-events:none; z-index:4;
    background:linear-gradient(135deg, rgba(220,240,238,.95), rgba(44,87,84,.5));
    clip-path:polygon(50% 0%, 100% 100%, 0% 100%);
    animation:shardFly .55s ease-out forwards;
  }
  .shard.big{ width:20px; height:20px; }
  @keyframes shardFly{
    to{ transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(.3); opacity:0; }
  }

  .phrase-panel{
    padding:20px 26px 26px;
    text-align:center;
    font-family:'Noto Kufi Arabic',sans-serif;
    font-size:26px;
    line-height:2;
    min-height:44px;
    position:relative; z-index:2;
  }
  .ch.correct{ color:var(--glass); }
  .ch.pending{ color:var(--text-dim); }
  .ch.wrong{ color:var(--blood-bright); text-decoration:underline wavy var(--blood-bright); }
  .ch.cursor{ border-bottom:3px solid var(--ember); }

  .victory{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:8px; z-index:5;
    background:rgba(13,10,8,.72);
    opacity:0; pointer-events:none; transform:scale(.9);
    transition:opacity .2s ease, transform .25s ease;
  }
  .victory.show{ opacity:1; transform:scale(1); pointer-events:auto; }
  .victory-title{
    font-family:'Noto Kufi Arabic',sans-serif; font-weight:900; font-size:26px;
    color:var(--ember); direction:rtl;
  }
  .victory-sub{ font-size:11px; color:var(--text-dim); font-family:'Cinzel',serif; letter-spacing:3px; }
  .victory button{ margin-top:10px; }

  .input-row{ display:flex; gap:10px; margin-bottom:14px; }
  #typeInput{
    flex:1;
    background:var(--bg-panel);
    border:1px solid var(--line);
    border-radius:6px;
    padding:16px 18px;
    font-family:'Noto Kufi Arabic',sans-serif;
    font-size:19px;
    color:var(--text);
    outline:none;
    direction:rtl;
    transition:border-color .15s, box-shadow .15s;
  }
  #typeInput:focus{ border-color:var(--ember); box-shadow:0 0 0 3px rgba(255,122,41,.15); }
  #typeInput.shake{ animation:inputShake .2s; border-color:var(--blood-bright); }
  @keyframes inputShake{
    25%{ transform:translateX(-5px); } 75%{ transform:translateX(5px); } 100%{ transform:translateX(0); }
  }

  .actions{ display:flex; align-items:center; justify-content:space-between; }
  .btn-group{ display:flex; gap:8px; }
  button{
    font-family:'Noto Sans Arabic',sans-serif;
    font-size:13px; font-weight:600;
    border-radius:5px; padding:11px 18px;
    cursor:pointer; border:1px solid transparent;
    transition:transform .08s ease, background .15s, border-color .15s;
  }
  button:active{ transform:scale(.96); }
  .btn-primary{
    background:linear-gradient(180deg,#e6552f,var(--blood));
    color:#fff0e6;
  }
  .btn-primary:hover{ filter:brightness(1.08); }
  .btn-ghost{ background:transparent; color:var(--text-dim); border-color:var(--line); }
  .btn-ghost:hover{ color:var(--bone); border-color:var(--ash); }
  .btn-end{ background:transparent; color:var(--text-dim); border:1px solid var(--line); font-size:12px; padding:9px 14px; }
  .btn-end:hover{ color:var(--blood-bright); border-color:var(--blood-bright); }

  .hint{ text-align:center; font-size:11px; color:var(--text-dim); margin-top:16px; font-family:'JetBrains Mono',monospace; direction:ltr; letter-spacing:.5px; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-mark">AB</div>
    <div>
      <div class="brand-name">ABDULKHALQ </div>
      <div class="brand-sub">XAWAN PRACTICE</div>
    </div>
  </div>
  <div class="stats" id="statsBar" style="display:none;">
    <div class="stat"><span>#</span><b id="statIndex">1 / 10</b></div>
    <div class="stat"><span>⏱</span><b id="statTime">0:00</b></div>
    <div class="stat wpm"><span>WPM</span><b id="statWpm">0</b></div>
    <div class="stat acc"><span>ACC</span><b id="statAcc">100%</b></div>
  </div>
</header>

<main>
  <div class="wrap">

    <div id="modeSelect">
      <h1>چەند ڕستە دەتەوێت تاقی بکەیتەوە؟</h1>
      <p>CHOOSE SESSION LENGTH</p>
      <div class="mode-row">
        <button class="mode-btn" data-n="10">١٠<small>QUICK</small></button>
        <button class="mode-btn" data-n="25">٢٥<small>STANDARD</small></button>
        <button class="mode-btn" data-n="42">٤٢<small>FULL SET</small></button>
      </div>
    </div>

    <div id="practiceArea">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

      <div class="stage" id="stage">
        <div class="stage-inner">
          <div class="stage-flash" id="stageFlash"></div>

          <div id="glassBox">
            <svg id="glassSvg" width="150" height="180" viewBox="0 0 150 180">
              <defs>
                <linearGradient id="glassFill" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#c9efec" stop-opacity=".24"/>
                  <stop offset="100%" stop-color="#2c5754" stop-opacity=".16"/>
                </linearGradient>
              </defs>
              <path d="M45 20 L105 20 L98 78 Q95 100 75 104 Q55 100 52 78 Z"
                    fill="url(#glassFill)" stroke="#8fd7d1" stroke-width="2.5" stroke-linejoin="round"/>
              <rect x="72" y="104" width="6" height="42" fill="#8fd7d1" opacity=".55"/>
              <ellipse cx="75" cy="150" rx="30" ry="7" fill="none" stroke="#8fd7d1" stroke-width="2.5" opacity=".6"/>
              <path d="M55 30 L58 60" stroke="#e6fbf9" stroke-width="2" opacity=".5" stroke-linecap="round"/>
              <g id="cracks" stroke="#f3fffe" stroke-width="1.4" fill="none" stroke-linecap="round">
                <path class="crack" data-n="1" d="M75 34 L66 52 L70 66"/>
                <path class="crack" data-n="2" d="M75 34 L88 48 L82 64"/>
                <path class="crack" data-n="3" d="M70 66 L60 76 L58 90"/>
                <path class="crack" data-n="4" d="M82 64 L93 74 L94 88"/>
                <path class="crack" data-n="5" d="M70 66 L82 64 L76 80"/>
              </g>
            </svg>
          </div>

          <div id="swordBox">
            <svg viewBox="0 0 130 150" width="130" height="150">
              <defs>
                <linearGradient id="bladeGrad" x1="0" y1="0" x2="1" y2="0">
                  <stop offset="0%" stop-color="#f4f1e8"/>
                  <stop offset="50%" stop-color="#cfd6d6"/>
                  <stop offset="100%" stop-color="#f4f1e8"/>
                </linearGradient>
              </defs>
              <path d="M62 6 L68 6 L74 88 L56 88 Z" fill="url(#bladeGrad)" stroke="#3a3430" stroke-width="1.2"/>
              <path d="M65 6 L65 88" stroke="#8a8378" stroke-width="1" opacity=".6"/>
              <path d="M50 88 L80 88 L83 98 L47 98 Z" fill="#8a1414" stroke="#3a3430" stroke-width="1"/>
              <circle cx="65" cy="93" r="2.2" fill="var(--ember)"/>
              <rect x="60" y="98" width="10" height="30" rx="3" fill="#3a2c1c" stroke="#c79a3a" stroke-width="1"/>
              <path d="M61 100 L61 126" stroke="#c79a3a" stroke-width="1" opacity=".5"/>
              <path d="M69 100 L69 126" stroke="#c79a3a" stroke-width="1" opacity=".5"/>
              <ellipse cx="65" cy="133" rx="10" ry="6" fill="#c79a3a" stroke="#3a3430" stroke-width="1"/>
              <circle cx="65" cy="133" r="3" fill="#8a1414"/>
            </svg>
          </div>

          <div class="victory" id="victory">
            <div class="victory-title" id="victoryTitle">دەست خۆش! تۆ بلیمەتیت</div>
            <div class="victory-sub">SESSION COMPLETE</div>
            <button class="btn-ghost" id="restartBtn" style="margin-top:8px;">گۆڕینی درێژی مەشق</button>
          </div>
        </div>

        <div class="phrase-panel" id="phrasePanel"></div>
      </div>

      <div class="input-row">
        <input id="typeInput" type="text" dir="rtl" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="ئێرە بنووسە...">
      </div>

      <div class="actions">
        <div class="btn-group">
          <button class="btn-primary" id="submitBtn">لێدان (Enter)</button>
          <button class="btn-ghost" id="skipBtn">بازدان</button>
        </div>
        <button class="btn-end" id="endBtn">کۆتایی</button>
      </div>

      <div class="hint">type each record · the sword strikes on every key · glass shatters on completion</div>
    </div>

  </div>
</main>

<script>
(function(){
  const itemsAll = ["نیشانەی رەفتارنەکردن بەنوسراوی دادگای بەرایی هەولیر/٦ بەژمارە ٢٢٥ استملاک / ب٦ / ٢٠٢٤ لە ١٩/١١/٢٠٢٤","سەرکەوت صالح احمد / عیراقی","خانوەکە پێک هاتوە لە دوو ژوورو مطبخ ، لە بلوک قورودار دروستکراوە وحمام ومرافق لەبلۆک کونکریت دروستکراوە","ملك صرف","تبديل اسم","وەزارەتی دارایی ومافی رەفتارکردنی کراوە بە (١١٦٧٣٤) بەش و (٣١٣٠٢) بەش بۆ (زریان خالد عباس) و (٥٤٧٦٣) بەش بۆ (یوسف عمر جاوسور) و (٣٠٦٦٩) بەش بۆ (کیفی عثمان محمود) کەعیراقین","زەوی بەتاڵ و دوکان","کراوە بە (٥) پشک و (٣) پشک بۆ (شوان عدنان معروف) و (٢) پشک بۆ (هاژە علی نجم) کەعیراقین","تنازل","هەردووخانوەکە دونهۆمە،هەردوونهۆمەکەش پێک هاتون لە دوو ژوورو هۆل ومطبخ و حمام و توالیت لەبلۆ ک وکۆ نکریت دروستکراوە،لەگەل زەوی سیاجکراو. خانوەکە پێک هاتوە لەیەک ژوورو مطبخ و حمام توالیت،بلوک وکۆنکرێت دروستکراوە،لەگەل هیکل","کسنزان","خانوەکە پێک هاتوە لە دوو ژوورو مطبخ ، لە بلوک قورودار دروستکراوە وحمام ومرافق لەبلۆک کونکریت دروستکراوە","بەردەرەش","گۆرینی رەگەز","استبدال","کرین و فرۆشتن تەنها بۆ مامۆستایانی زانکۆیە","نیشانەی رەفتارنەکردن بەنوسراوی دادگای بەرایی هەولیر/٦بەژمارە/٥٩/ب٦لە١١/٢/٢٠٢٥","گردەسور","کراوەبە (٣٢٣٦٦) پشک و (١٢٥٠٠) پشک بۆ (اراس کاکە خان محمد) و (١٩٨٦٦) پشک بۆ (قادر محمدامین مولود) کە عراقین","استملاك و استبدال","شوقە پێکهاتوەلە سێ ژوور ومطبخ وحمام توالیت و بلوک وکۆنکرێت دروستکراوە","گواستنەوە وگۆرینی رەگەز","ابراهیم دلشاد یاسین / عیراقی","هەروەک چۆن لە نەخشەی خانووبەرە","دانانی نیشانەی رەفتارنەکردن بەنوسراوی دادگایی بەرایی هەولێر/ ٣ژمارە (٣٧٣٧) ب/٣لە٢٠٢٥/٨/٦","خانوو ودوکان لەگەڵ هیکل","کراوەبە (٩٦) پشک و (٤١) پشک بۆ (عبدالکریم بلال عبدالرحمن) و (٤٨) پشک بۆ (سیڤەر بەرزان فاضل) و (٧) پشک بۆ (نازنین رشید احمد) کە عیراقیین","ڕاستکردنەوەی ناو","کراوەبە (٢) پشک و (١) پشک بۆ هەریەکەلە (سلمان رحمان ابراهیم ) و (شیروان قهار عبدالستار) کە عیراقین","خانوو","يلى حمدامين صادق / العراقي","رشيد كاكو رسول / العراقي خانوەکە پێک هاتوە لە دوو نهۆم /هەردوو نهۆم /دوو ژوور وحمام ومرافق لە بلۆک وکۆنکریت دروست کراوە لمطبخ و حمام توالیت ، لە بلوک وکۆنکرێت دروستکراوە / خانوی دووەم/ پێک هاتوە لە سێ ژوورو هۆڵ و مطبخ و حمام توالیت ، لە بلوک وکۆنکرێت دروستکراوە","فرۆشتن و رووخاندن","العراقي","ارض الدار مع ابنيتها","بەردەرەشی گەورە","مولکی دەوڵەت و (١٨٤٠٠) بەش مولکی تەواوە","نقل قيد وتصحيح التسجيل","مملوكة للدولةو (٧٥٠٠٠) سهم ملك صرف","عرصة مسيجة","بەناو کردنی گرێ بەستی کشتوکاڵیە","کراوەبە (٢) پشک و (١) پشک بۆ هەریەکەلە (مظفر انور ولی) و (زیرە ک سلام عزیز) کە عراقین"];

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const el = {
    modeSelect: document.getElementById('modeSelect'),
    practiceArea: document.getElementById('practiceArea'),
    statsBar: document.getElementById('statsBar'),
    phrase: document.getElementById('phrasePanel'),
    input: document.getElementById('typeInput'),
    glassBox: document.getElementById('glassBox'),
    swordBox: document.getElementById('swordBox'),
    stageInner: document.querySelector('.stage-inner'),
    flash: document.getElementById('stageFlash'),
    progress: document.getElementById('progressFill'),
    statIndex: document.getElementById('statIndex'),
    statTime: document.getElementById('statTime'),
    statWpm: document.getElementById('statWpm'),
    statAcc: document.getElementById('statAcc'),
    victory: document.getElementById('victory'),
    submitBtn: document.getElementById('submitBtn'),
    skipBtn: document.getElementById('skipBtn'),
    endBtn: document.getElementById('endBtn'),
    restartBtn: document.getElementById('restartBtn')
  };

  let items = [];
  let idx = 0;
  let correctKeys = 0, totalKeys = 0, correctChars = 0;
  let startTime = null, timerHandle = null;

  document.querySelectorAll('.mode-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const n = parseInt(btn.dataset.n, 10);
      items = itemsAll.slice(0, n);
      el.modeSelect.style.display = 'none';
      el.practiceArea.style.display = 'block';
      el.statsBar.style.display = 'flex';
      resetSession();
      el.input.focus();
    });
  });

  el.restartBtn.addEventListener('click', ()=>{
    el.practiceArea.style.display = 'none';
    el.statsBar.style.display = 'none';
    el.modeSelect.style.display = 'flex';
  });

  function renderPhrase(){
    const target = items[idx];
    const typed = el.input.value;
    el.phrase.innerHTML = '';
    for(let i=0;i<target.length;i++){
      const span = document.createElement('span');
      span.className = 'ch';
      span.textContent = target[i];
      if(i < typed.length){
        span.classList.add(typed[i] === target[i] ? 'correct' : 'wrong');
      } else {
        span.classList.add('pending');
        if(i === typed.length) span.classList.add('cursor');
      }
      el.phrase.appendChild(span);
    }
    el.statIndex.textContent = (idx+1) + ' / ' + items.length;
    el.progress.style.width = Math.round((idx/items.length)*100) + '%';
  }

  function startTimerIfNeeded(){
    if(startTime) return;
    startTime = Date.now();
    timerHandle = setInterval(()=>{
      const s = Math.floor((Date.now()-startTime)/1000);
      const m = Math.floor(s/60), r = s%60;
      el.statTime.textContent = m + ':' + (r<10?'0':'') + r;
      const mins = (Date.now()-startTime)/60000;
      el.statWpm.textContent = mins>0 ? Math.round((correctChars/5)/mins) : 0;
    }, 500);
  }

  function updateAcc(){
    const acc = totalKeys>0 ? Math.round((correctKeys/totalKeys)*100) : 100;
    el.statAcc.textContent = acc + '%';
  }

  function swordStrike(){
    if(reduceMotion) return;
    el.swordBox.classList.remove('strike');
    void el.swordBox.offsetWidth;
    el.swordBox.classList.add('strike');
    spawnSpark();
  }

  function spawnSpark(){
    const rect = el.glassBox.getBoundingClientRect();
    const stageRect = el.stageInner.getBoundingClientRect();
    const cx = rect.left - stageRect.left + rect.width*0.62;
    const cy = rect.top - stageRect.top + rect.height*0.25;
    for(let i=0;i<3;i++){
      const s = document.createElement('div');
      s.className = 'spark';
      const ang = Math.random()*Math.PI*2;
      const dist = 16 + Math.random()*18;
      s.style.setProperty('--dx', Math.cos(ang)*dist + 'px');
      s.style.setProperty('--dy', Math.sin(ang)*dist + 'px');
      s.style.left = cx + 'px';
      s.style.top = cy + 'px';
      el.stageInner.appendChild(s);
      s.addEventListener('animationend', ()=> s.remove());
    }
  }

  function updateCracks(){
    const target = items[idx];
    const typed = el.input.value;
    let correctSoFar = 0;
    for(let i=0;i<typed.length;i++){ if(typed[i]===target[i]) correctSoFar++; else break; }
    const frac = target.length>0 ? correctSoFar/target.length : 0;
    const want = Math.min(5, Math.ceil(frac*5));
    document.querySelectorAll('#cracks .crack').forEach(c=>{
      const n = parseInt(c.dataset.n,10);
      c.classList.toggle('show', n<=want);
    });
  }

  function resetCracks(){
    document.querySelectorAll('#cracks .crack').forEach(c=> c.classList.remove('show'));
  }

  function shatterGlass(big){
    if(reduceMotion){
      el.glassBox.classList.add('hidden');
      setTimeout(()=> el.glassBox.classList.remove('hidden'), 220);
      return;
    }
    flash();
    el.glassBox.classList.add('hidden');
    const rect = el.glassBox.getBoundingClientRect();
    const stageRect = el.stageInner.getBoundingClientRect();
    const cx = rect.left - stageRect.left + rect.width/2;
    const cy = rect.top - stageRect.top + rect.height*0.42;
    const count = big ? 18 : 8;
    for(let i=0;i<count;i++){
      const sh = document.createElement('div');
      sh.className = 'shard' + (big ? ' big' : '');
      const ang = Math.random()*Math.PI*2;
      const dist = (big ? 80 : 44) + Math.random()* (big?90:46);
      sh.style.setProperty('--dx', Math.cos(ang)*dist + 'px');
      sh.style.setProperty('--dy', (Math.sin(ang)*dist - (big?24:8)) + 'px');
      sh.style.setProperty('--rot', (Math.random()*540-270) + 'deg');
      sh.style.left = (cx-7) + 'px';
      sh.style.top = (cy-7) + 'px';
      el.stageInner.appendChild(sh);
      sh.addEventListener('animationend', ()=> sh.remove());
    }
    setTimeout(()=>{
      el.glassBox.classList.remove('hidden');
      resetCracks();
    }, big ? 650 : 380);
  }

  function flash(){
    el.flash.classList.add('on');
    requestAnimationFrame(()=>{
      el.flash.style.transition = 'opacity .4s ease';
      el.flash.classList.remove('on');
      setTimeout(()=>{ el.flash.style.transition=''; }, 400);
    });
  }

  function showVictory(){
    el.victory.classList.add('show');
    el.progress.style.width = '100%';
  }
  function hideVictory(){
    el.victory.classList.remove('show');
  }

  function nextItem(){
    idx++;
    if(idx >= items.length){
      shatterGlass(true);
      showVictory();
      clearInterval(timerHandle);
      el.input.disabled = true;
      return;
    }
    el.input.value = '';
    renderPhrase();
  }

  function handleInput(){
    startTimerIfNeeded();
    const target = items[idx];
    const typed = el.input.value;

    if(typed.length > 0){
      const lastCorrect = typed[typed.length-1] === target[typed.length-1];
      totalKeys++;
      if(lastCorrect) correctKeys++;
      swordStrike();
      if(!lastCorrect){
        el.input.classList.remove('shake');
        void el.input.offsetWidth;
        el.input.classList.add('shake');
      }
    }
    correctChars = 0;
    for(let i=0;i<typed.length;i++){ if(typed[i]===target[i]) correctChars++; }

    updateAcc();
    updateCracks();
    renderPhrase();

    if(typed === target){
      shatterGlass(false);
      setTimeout(nextItem, 240);
    }
  }

  function skip(){
    resetCracks();
    el.input.value = '';
    nextItem();
  }

  function resetSession(){
    clearInterval(timerHandle);
    startTime = null;
    idx = 0; correctKeys=0; totalKeys=0; correctChars=0;
    el.input.disabled = false;
    el.input.value = '';
    el.statTime.textContent = '0:00';
    el.statWpm.textContent = '0';
    el.statAcc.textContent = '100%';
    hideVictory();
    resetCracks();
    renderPhrase();
  }

  el.input.addEventListener('input', handleInput);
  el.input.addEventListener('keydown', (e)=>{
    if(e.key === 'Enter'){
      e.preventDefault();
      if(el.input.value === items[idx]){ shatterGlass(false); setTimeout(nextItem, 240); }
    }
  });
  el.submitBtn.addEventListener('click', ()=>{
    if(el.input.value === items[idx]){ shatterGlass(false); setTimeout(nextItem, 240); }
  });
  el.skipBtn.addEventListener('click', skip);
  el.endBtn.addEventListener('click', ()=>{
    el.practiceArea.style.display = 'none';
    el.statsBar.style.display = 'none';
    el.modeSelect.style.display = 'flex';
  });
})();
</script>
</body>
</html>
