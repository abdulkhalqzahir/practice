<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>فایلەکان</title>
<style>
:root{--bg:#eef1f5;--surface:#fff;--ink:#14202e;--muted:#5d6b7c;--line:#d8dee7;--accent:#1d4ed8;--accent-ink:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0f1620;--surface:#17212e;--ink:#e8edf4;--muted:#93a1b3;--line:#263446;--accent:#6ea0ff;--accent-ink:#0b1220}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;line-height:1.6}
header{max-width:960px;margin:0 auto;padding:40px 20px 16px}
h1{margin:0 0 4px;font-size:2rem}
.sub{color:var(--muted);margin:0}
.bar{max-width:960px;margin:0 auto;padding:12px 20px}
.bar input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit}
.bar input:focus,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{max-width:960px;margin:0 auto;padding:0 20px 60px}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.thumb{flex:none;width:52px;height:52px;border-radius:8px;background:var(--bg);display:grid;place-items:center;font-weight:700;font-size:.8rem;color:var(--accent);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.info{flex:1;min-width:0}
.name{font-weight:600;overflow-wrap:anywhere}
.desc{color:var(--muted);font-size:.9rem}
.acts{display:flex;gap:8px;flex:none}
.btn{padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;font-size:.9rem}
.btn.main{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.empty{text-align:center;color:var(--muted);padding:60px 20px;border:2px dashed var(--line);border-radius:14px}
@media (max-width:560px){.row{flex-wrap:wrap}.acts{width:100%}.acts .btn{flex:1;text-align:center}}
</style>
</head>
<body>
<header>
  <h1>فایلەکان</h1>
  <p class="sub" id="count"></p>
</header>
<div class="bar"><input id="q" type="search" placeholder="گەڕان بە ناوی فایل…" aria-label="گەڕان"></div>
<main><div class="list" id="list"></div></main>

<script>
/* ═══════════════════════════════════════════════════════════
   لێرە فایلەکانت زیاد بکە.
   هەر فایلێک یەک دێڕە. فایلەکە بخەرە ناو فۆڵدەری files،
   پاشان ئەم دێڕە کۆپی بکە و ناو و ناوی فایلەکە بگۆڕە:

   { name: "ناوی پیشاندراو", file: "files/ناوی-فایلەکە.pdf", desc: "ڕوونکردنەوە (ئارەزوومەندانە)" },
   ═══════════════════════════════════════════════════════════ */
const FILES = [
  { name: "نموونە — سکریپتی AutoHotkey", file: "files/RightClick_ShiftEnter.zip", desc: "ئەمە نموونەیە، بیسڕەوە یان بیگۆڕە" },
  { name: "بەرنامەکە سەرەتا دابەزێنە", file: "files/AutoHotkey_2.0.28_setup.zip", desc: "ئەمە نموونەیە، بیسڕەوە یان بیگۆڕە" },
  { name: "تۆمارەکان", file: "files/تۆمارەکان.zip", desc: "تەنها بۆ بەروار گۆرین" },
  { name: "گۆرینی شوێنی کیبۆرد", file: "files/Microsoft_PowerToys_Installer.zip", desc: "بەدڵی خۆر شوێنەکان بگۆرە" },
   { name: "خانە بەتاڵەکان", file: "files/akam_xanay_batal_pekhata.zip", desc: "بۆ ناردنی خانە بەتاڵەکان" },
    { name: "تەنها بۆ essment و enumbranc", file: "files/encumbrance_fixed_f4.zip", desc: "ناردنی هەموو فایلە بەتاڵەکان" },
 { name: "کارمەندەکان", file: "files/abdulkhalq_کارمەندەکان.zip", desc: " بەرواری سەرەوەت ڕاست کردەوە ڕاستەوخۆ کۆپی دەکات" },

 { name: "دیدتایپ", file: "files/nusrawi_hover.zip", desc: " جۆری گرێبەست " },

  // ↓ لێرە فایلی نوێ زیاد بکە ↓

];
/* ═══════════════════════════════════════════════════════════ */

const $=s=>document.querySelector(s);
const IMG=/\.(png|jpe?g|gif|webp|svg)$/i;
const CAN_OPEN=/\.(pdf|png|jpe?g|gif|webp|svg|txt|html?|mp4|mp3)$/i; // فایلی AHK و ZIP تەنها دادەبەزن
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const enc=p=>p.split('/').map(encodeURIComponent).join('/');
function render(){
  const q=$('#q').value.trim().toLowerCase();
  const shown=FILES.filter(f=>(f.name+' '+(f.desc||'')+' '+f.file).toLowerCase().includes(q));
  $('#count').textContent=FILES.length?shown.length+' فایل':'';
  if(!FILES.length){$('#list').innerHTML='<div class="empty">هیچ فایلێک زیاد نەکراوە.</div>';return}
  if(!shown.length){$('#list').innerHTML='<div class="empty">هیچ فایلێک بەم ناوە نەدۆزرایەوە.</div>';return}
  $('#list').innerHTML=shown.map(f=>{
    const ext=(f.file.split('.').pop()||'').slice(0,4).toUpperCase();
    const th=IMG.test(f.file)?`<img src="${enc(f.file)}" alt="" loading="lazy">`:esc(ext);
    const fname=f.file.split('/').pop();
    return `<div class="row"><div class="thumb">${th}</div>
      <div class="info"><div class="name">${esc(f.name)}</div>${f.desc?`<div class="desc">${esc(f.desc)}</div>`:''}</div>
      <div class="acts">${CAN_OPEN.test(f.file)?`<a class="btn" href="${enc(f.file)}" target="_blank" rel="noopener">کردنەوە</a>`:''}
      <a class="btn main" href="${enc(f.file)}" download="${esc(fname)}">داگرتن</a></div></div>`}).join('');
}
$('#q').addEventListener('input',render);
render();
</script>
</body>
</html>
